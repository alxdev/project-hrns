[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-harness"
version = "0.1.0"
description = "An educational, extensible coding-agent harness in Python"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "httpx2>=2.10,<3",
    "python-dotenv>=1,<2",
    "prompt-toolkit>=3.0.50,<4",
    "rich>=13,<15",
    "mcp>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^tests/"]
